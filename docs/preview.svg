      <stop offset="0" stop-color="#0b2f4a"/>
      <stop offset="0.55" stop-color="#0f5f73"/>
      <stop offset="1" stop-color="#1b8f86"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fd3c6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5fd3c6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a7bd5" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3a7bd5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
